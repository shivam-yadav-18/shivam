<div id="container">
  <input id="box1" readonly value="0">
  <div class="buttons">
    <button class="a" onclick="clearDisplay()">AC</button>
    <button class="a" onclick="deleteLast()">⌫</button>
    <button class="a" onclick="appendOperator('%')">%</button>
    <button class="a" onclick="appendOperator('/')">/</button>
    <button class="a" onclick="appendNumber('7')">7</button>
    <button class="a" onclick="appendNumber('8')">8</button>
    <button class="a" onclick="appendNumber('9')">9</button>
    <button class="a" onclick="appendOperator('*')">*</button>
    <button class="a" onclick="appendNumber('4')">4</button>
    <button class="a" onclick="appendNumber('5')">5</button>
    <button class="a" onclick="appendNumber('6')">6</button>
    <button class="a" onclick="appendOperator('-')">-</button>
    <button class="a" onclick="appendNumber('1')">1</button>
    <button class="a" onclick="appendNumber('2')">2</button>
    <button class="a" onclick="appendNumber('3')">3</button>
    <button class="a" onclick="appendOperator('+')">+</button>
    <button class="a" onclick="appendNumber('0')">0</button>
    <button class="a" onclick="appendDecimal()">.</button>
    <button class="a A1" onclick="calculate()">=</button>
  </div>
</div>

<script>
let display = document.getElementById('box1');
let currentInput = '';
let resultShown = false;

function appendNumber(number) {
  if (resultShown) { currentInput = ''; resultShown = false; }
  currentInput += number;
  updateDisplay();
}
function appendOperator(operator) {
  if (currentInput === '') return;
  if (/[+\-*/%]$/.test(currentInput)) { currentInput = currentInput.slice(0, -1); }
  currentInput += operator;
  resultShown = false;
  updateDisplay();
}
function appendDecimal() {
  const parts = currentInput.split(/[\+\-\*/%]/);
  const last = parts[parts.length - 1];
  if (!last.includes('.')) { currentInput += '.'; updateDisplay(); }
}
function clearDisplay() { currentInput = ''; updateDisplay('0'); }
function deleteLast() { currentInput = currentInput.slice(0, -1); updateDisplay(currentInput || '0'); }
function calculate() {
  try {
    let expr = currentInput.replace(/%/g, '/100');
    let result = eval(expr);
    updateDisplay(result);
    currentInput = result.toString();
    resultShown = true;
  } catch { updateDisplay('Error'); currentInput = ''; }
}
function updateDisplay(content = currentInput) { display.value = content; }
</script>
